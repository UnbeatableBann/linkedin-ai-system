# ─────────────────────────────────────────────────────────────────────────────
# LinkedIn AI Content System — Docker Compose (local dev)
#
# Services:
#   api      — FastAPI + Uvicorn (hot reload in dev)
#   worker   — Celery worker (LLM generation + publishing tasks)
#   beat     — Celery Beat (cron: reminders, auto-schedule, session expiry)
#   redis    — Redis 7 (Celery broker + result backend)
#
# Usage:
#   cp .env.example .env   # fill in your secrets
#   docker-compose up --build
#
# Telegram webhook (local dev requires ngrok):
#   ngrok http 8000
#   curl "https://api.telegram.org/bot{TOKEN}/setWebhook?url=https://YOUR.ngrok.io/webhooks/telegram&secret_token={SECRET}"
# ─────────────────────────────────────────────────────────────────────────────

services:

  redis:
    image: redis:7-alpine
    container_name: linkedin_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # Persist jobs across restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: linkedin_ai_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./src:/app/src    # Hot reload: mount source code
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 40s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: linkedin_ai_worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./src:/app/src
    command: >
      uv run celery -A app.scheduler.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=generation,publishing,default
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: linkedin_ai_beat
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./src:/app/src
    command: >
      uv run celery -A app.scheduler.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
      --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  uv_cache: