[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "linkedin-ai-system"
version = "1.0.0"
requires-python = ">=3.12"

authors = [
    { name = "Shadab" }
]

dependencies = [
    # Web framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.12,<0.1",

    # Task queue
    "celery[redis]>=5.4,<6.0",
    "redis>=5.2,<6.0",

    # Database
    "supabase>=2.10,<3.0",
    "asyncpg>=0.30,<1.0",

    # LLM providers (these change often → keep tighter)
    "anthropic>=0.40,<1.0",
    "openai>=1.57,<2.0",
    "groq>=0.13,<1.0",

    # Config & validation
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",

    # Security (be careful but not frozen)
    "cryptography>=44,<46",

    # Date/time parsing
    "python-dateutil>=2.9,<3.0",
    "pytz>=2024.2",
    "dateparser>=1.2,<2.0",

    # Utilities
    "tenacity>=9,<10",
    "structlog>=24,<25",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.0",
    "ruff==0.8.3",
    "mypy==1.13.0",
]

docs = [
    "scalar-fastapi"
]


[tool.uv]
compile-bytecode = true
link-mode = "copy"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
